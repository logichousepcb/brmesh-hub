; BRMesh Hub for ESP32-C6 and ESP32-C3 (both have a Bluetooth 5 LE radio).
;
; Needs Arduino core 3.x, which comes from the pioarduino platform
; (Arduino 3.3.11 / ESP-IDF 5.5). Its Bluetooth stack is NimBLE.
;
; Each build writes .pio/build/<env>/firmware.factory.bin (bootloader +
; partitions + app) for a blank chip at 0x0, and firmware.bin for the web
; page's Firmware Update.
;
;   pio run -e esp32c6 -t upload
;   pio run -e esp32c3 -t upload

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
; 4 MB layout (works on 4 MB and 8 MB modules): two 1.9 MB OTA app slots.
; Firmware uploaded later through the web page must use the same table.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0

; ESP32-C6-DevKitC-1: serial log on the "UART" USB port.
[env:esp32c6]
board = esp32-c6-devkitc-1

; ESP32-C3 boards wired to the chip's own USB port (USB-Serial/JTAG): the
; serial log goes to that port too. The RTS reset after flashing drops these
; boards back into download mode, so reset with the watchdog instead.
[env:esp32c3]
board = esp32-c3-devkitm-1
board_upload.after_reset = watchdog-reset
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
